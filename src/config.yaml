  log_format: text
reports:
  report_dir: C:\Intel\parquet
  market_breadth_years: 3
r2:
  enabled: false
  bucket_name: ''
  prefix: stock-ingestion/
scheduler:
  enabled: true
  schedule_time: '16:14'
  timezone: America/New_York
fear_greed:
  enabled: true
  start_date: '2020-08-01'
  timeout_seconds: 15
  alert_threshold: 25.0
signals:
  folder_path: C:\Intel\parquet\quant_strategy_building
  backdate_days: 3
  max_holding_days: 8
  overwrite_existing: true
  min_reward_risk: 1.39
  min_target_pct: 5.5
  exclude_clusters: []
  exclude_models: []
  filter_below_open: false
signal_analysis:
  backdate_days: 90
  max_holding_days: 8
  mc_iterations: 50
  benchmark: SPY
  sets:
  - name: version_p
    folder: C:\Intel\parquet\quant_strategy_building\version_p
  - name: version_q
    folder: C:\Intel\parquet\quant_strategy_building\version_q
client_dml:
  # F26-T1: client-issued DML confined to these schemas (dml_admin
  # action + generalized do_put). pivot is the Bollinger-PM namespace.
  allowed_namespaces:
  - pivot
  # null -> server.query_timeout_seconds bounds each op's execution unit
  dml_timeout_seconds: null
  # null -> advisory namespace-size quota off
  max_namespace_mb: null
  # dml_sweep drops only pinned=false registry objects older than this
  ttl_days: 90
