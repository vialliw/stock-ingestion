name: Daily Load to R2

on:
  schedule:
    # Weekdays at 22:00 UTC (18:00 ET during DST, 17:00 ET standard time).
    # Gives 1-2 hours buffer after US market close at 16:00 ET.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  daily-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      DB_DIR: /tmp/duckdb
      DB_FILENAME: stock_ingestion.duckdb
      LOG_FILE: /tmp/stock_ingestion.log
      LOG_FORMAT: text

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify R2 credentials
        run: |
          set -e
          for var in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET_NAME; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Missing secret $var"
              exit 1
            fi
          done
          echo "All R2 secrets present."

      - name: Run daily load
        run: |
          python scripts/ci_daily_load.py

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-load-log
          path: /tmp/stock_ingestion.log
          retention-days: 7
