name: Verify Secrets

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify R2 connection
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -e
          pip install --quiet boto3
          python3 - <<'PY'
          import os, sys, boto3
          from botocore.client import Config
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(s3={"addressing_style": "path"}),
          )
          try:
              buckets = s3.list_buckets()
          except Exception as e:
              print(f"R2 FAIL: {e}")
              sys.exit(1)
          names = [b["Name"] for b in buckets.get("Buckets", [])]
          print(f"R2 OK: endpoint reachable, {len(names)} bucket(s): {names}")
          PY

      - name: Verify OpenRouter SWE-1.7 key
        env:
          API_KEY_SWE_17: ${{ secrets.API_KEY_SWE_17 }}
        run: |
          set -e
          resp=$(curl -sS -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${API_KEY_SWE_17}" \
            -H "Content-Type: application/json" \
            -d '{"model":"aeternum/swe-1.7","messages":[{"role":"user","content":"ping"}],"max_tokens":1}')
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "SWE-1.7 HTTP status: $code"
          echo "SWE-1.7 response: $body"
          if [ "$code" != "200" ]; then echo "SWE-1.7 FAIL"; exit 1; fi
          echo "SWE-1.7 OK"

      - name: Verify OpenRouter GLM-5.2 key
        env:
          API_KEY_GLM_52: ${{ secrets.API_KEY_GLM_52 }}
        run: |
          set -e
          resp=$(curl -sS -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${API_KEY_GLM_52}" \
            -H "Content-Type: application/json" \
            -d '{"model":"z-ai/glm-5.2","messages":[{"role":"user","content":"ping"}],"max_tokens":1}')
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "GLM-5.2 HTTP status: $code"
          echo "GLM-5.2 response: $body"
          if [ "$code" != "200" ]; then echo "GLM-5.2 FAIL"; exit 1; fi
          echo "GLM-5.2 OK"
